name: Build AppImage

on:
  push:
    branches: [main]
    tags:     ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            cmake ninja-build \
            qt6-base-dev \
            libgl1-mesa-dev \
            librsvg2-bin \
            libfuse2

      - name: Configure
        run: cmake --preset release -G Ninja

      - name: Build
        run: cmake --build build/release --parallel

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp build/release/iso-converter AppDir/usr/bin/

          cat > AppDir/usr/share/applications/iso-converter.desktop << 'EOF'
          [Desktop Entry]
          Name=ISO Converter
          Comment=Convert CUE/BIN disc images to ISO
          Exec=iso-converter
          Icon=iso-converter
          Type=Application
          Categories=Utility;
          EOF

          rsvg-convert -w 256 -h 256 assets/iso-converter.svg \
            -o AppDir/usr/share/icons/hicolor/256x256/apps/iso-converter.png

      - name: Download linuxdeploy
        run: |
          mkdir -p tools
          wget -q -O tools/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O tools/linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x tools/linuxdeploy-x86_64.AppImage tools/linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage
        env:
          QMAKE: /usr/lib/qt6/bin/qmake
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          ./tools/linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iso-converter-appimage
          path: 'ISO_Converter-x86_64.AppImage'
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: 'ISO_Converter-x86_64.AppImage'
